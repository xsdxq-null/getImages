allow = ["Bash=python -c \"\n# 基于调研确认的 detailData.mediaItems 结构，验证主图/主图视频提取策略\nproduct = {'mediaItems': [\n    {'type': 'image', 'imageUrl': {'big': '//sc01.alicdn.com/kf/HTB1-main-a.jpg', 'normal': '//sc01.alicdn.com/kf/HTB1-main-a_s.jpg'}},\n    {'type': 'image', 'imageUrl': {'normal': '//sc01.alicdn.com/kf/HTB1-main-b_s.jpg'}},\n    {'type': 'video', 'videoUrl': 'https://video.alicdn.com/v1/offercore/xx.mp4'},\n    {'type': 'image', 'imageUrl': {'big': '//sc01.alicdn.com/kf/HTB1-main-c.jpg'}},\n]}\nimages = [i['imageUrl'].get('big') or i['imageUrl'].get('normal') for i in product['mediaItems'] if i.get('type') == 'image']\nvideos = [i.get('videoUrl') for i in product['mediaItems'] if i.get('type') == 'video']\nprint('主图:', images)\nprint('主图视频:', videos)\nassert len(images) == 3 and len(videos) == 1, '提取数量不符'\nprint('策略验证通过: big 优先、normal 兜底、视频独立提取')\n\"", "Bash=cd \"C:\\Users\\12974\\Desktop\\getImages\" && echo \"===== git 不跟踪的重要目录 =====\" && for d in .venv frontend/node_modules frontend/dist data .codegraph backend/__pycache__; do if [ -d \"$d\" ]; then n=$(find \"$d\" -type f 2>/dev/null | wc -l); echo \"OK   $d （$n 个文件）\"; else echo \"缺失 $d\"; fi; done && echo \"===== 后端核心文件抽查 =====\" && for f in backend/app/main.py backend/app/scheduler.py backend/app/engine/crawler.py backend/app/engine/extractor.py backend/app/api/tasks.py backend/requirements.txt; do [ -f \"$f\" ] && echo \"OK   $f\" || echo \"缺失 $f\"; done && echo \"===== 前端核心文件抽查 =====\" && for f in frontend/package.json frontend/vite.config.js frontend/src/main.js frontend/src/views/TaskListView.vue frontend/src/views/TaskDetailView.vue frontend/src/components/LogStream.vue; do [ -f \"$f\" ] && echo \"OK   $f\" || echo \"缺失 $f\"; done"]
